name: Release

# Triggered by the tag that tools/release.py pushes (CLAUDE.md §10).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group ci --group build

      - name: Verify tag matches pyproject
        run: python tools/release.py verify-tag "$TAG"

      - name: Tests
        run: python -m pytest -q

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Write build info
        run: python tools/release.py build-info "$TAG"

      # Read-only: caches are saved by warm-build-cache.yml on main, because a cache
      # saved from a tag run would be invisible to every later tag.
      - uses: ./.github/actions/build-cache
        with:
          phase: restore

      # flet-cli installs whatever the cache didn't supply: Flutter SDK, JDK and
      # Android SDK pieces (--yes).
      - name: Build APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flet build apk --yes --no-rich-output -v

      - name: Collect and check APK
        run: |
          mapfile -t apks < <(find build/apk -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::expected exactly one APK, found: ${apks[*]}"
            exit 1
          fi
          # Fixed naming scheme: Komi Store pins the asset variant, so never change it.
          name="tidewrack-${TAG#v}-arm64-v8a.apk"
          mkdir dist
          cp "${apks[0]}" "dist/$name"

          # Refuse to publish anything not signed with the release key.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          certs="$("$apksigner" verify --print-certs "dist/$name")"
          echo "$certs"
          if grep -q "CN=Android Debug" <<<"$certs"; then
            echo "::error::APK is debug-signed; check the signing secrets"
            exit 1
          fi

          (cd dist && sha256sum "$name" > "$name.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release.py notes "$TAG" > "$RUNNER_TEMP/notes.md"
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Tidewrack $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"

      # Runs whatever happened above. A missing secret or a Pushover outage only
      # warns: by this point the release itself has already succeeded or failed.
      - name: Notify via Pushover
        if: always()
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          if [ -z "$PUSHOVER_APP_TOKEN" ] || [ -z "$PUSHOVER_USER_KEY" ]; then
            echo "::warning::Pushover secrets not set; skipping notification"
            exit 0
          fi
          kind="release"
          if [[ "$TAG" == *-* ]]; then kind="pre-release"; fi
          case "$STATUS" in
            success)
              title="Tidewrack $TAG published"
              message="The $kind is on GitHub; Komi Store will pick it up on its next check."
              url="$RELEASE_URL"; url_title="View release" ;;
            cancelled)
              title="Tidewrack $TAG cancelled"
              message="The release run was cancelled before it finished."
              url="$RUN_URL"; url_title="View run" ;;
            *)
              title="Tidewrack $TAG FAILED"
              message="The release run failed. Check the logs to see which step broke."
              url="$RUN_URL"; url_title="View logs" ;;
          esac
          curl -sS --fail-with-body --retry 3 \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=$title" \
            --form-string "message=$message" \
            --form-string "url=$url" \
            --form-string "url_title=$url_title" \
            https://api.pushover.net/1/messages.json \
            || echo "::warning::Pushover notification failed"

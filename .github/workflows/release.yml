name: Release

# Triggered by the tag that tools/release.py pushes (CLAUDE.md §10).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          # Runtime dependencies (pyproject [project].dependencies) for the tests.
          python -c "import tomllib; print(*tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies'], sep='\n')" > "$RUNNER_TEMP/requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements.txt" --group ci --group build

      - name: Verify tag matches pyproject
        run: python tools/release.py verify-tag "$TAG"

      - name: Tests
        run: python -m pytest -q

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Write build info
        run: python tools/release.py build-info "$TAG"

      # Read-only: caches are saved by warm-build-cache.yml on main, because a cache
      # saved from a tag run would be invisible to every later tag.
      - uses: ./.github/actions/build-cache
        with:
          phase: restore

      # flet-cli installs whatever the cache didn't supply: Flutter SDK, JDK and
      # Android SDK pieces (--yes).
      - name: Build APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flet build apk --yes --no-rich-output -v

      - name: Collect and check APK
        run: |
          mapfile -t apks < <(find build/apk -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::expected exactly one APK, found: ${apks[*]}"
            exit 1
          fi
          # Fixed naming scheme: Komi Store pins the asset variant, so never change it.
          name="tidewrack-${TAG#v}-arm64-v8a.apk"
          mkdir dist
          cp "${apks[0]}" "dist/$name"

          # Refuse to publish anything not signed with the release key.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          certs="$("$apksigner" verify --print-certs "dist/$name")"
          echo "$certs"
          if grep -q "CN=Android Debug" <<<"$certs"; then
            echo "::error::APK is debug-signed; check the signing secrets"
            exit 1
          fi

          (cd dist && sha256sum "$name" > "$name.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release.py notes "$TAG" > "$RUNNER_TEMP/notes.md"
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Tidewrack $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"

      # Runs whatever happened above. A missing secret or an ntfy outage only
      # warns: by this point the release itself has already succeeded or failed.
      # NTFY_URL is the full topic URL (https://<server>/<topic>); NTFY_TOKEN is
      # an access token with write access to it (optional if the topic is open).
      - name: Notify via ntfy
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          # Komi Store's own deep link to a repo's page (the one its install
          # notifications use); a plain github.com link may open GitHub instead.
          KOMI_URL: githubstore://repo/${{ github.repository }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "::warning::NTFY_URL secret not set; skipping notification"
            exit 0
          fi
          kind="release"
          if [[ "$TAG" == *-* ]]; then kind="pre-release"; fi
          case "$STATUS" in
            success)
              title="Tidewrack $TAG published"
              message="The $kind is on GitHub; Komi Store will pick it up on its next check."
              priority=default; tags=tada
              click="$KOMI_URL"
              actions="view, Open in Komi Store, $KOMI_URL, clear=true; view, View release, $RELEASE_URL" ;;
            cancelled)
              title="Tidewrack $TAG cancelled"
              message="The release run was cancelled before it finished."
              priority=default; tags=warning
              click="$RUN_URL"
              actions="view, View run, $RUN_URL" ;;
            *)
              title="Tidewrack $TAG FAILED"
              message="The release run failed. Check the logs to see which step broke."
              priority=high; tags=x
              click="$RUN_URL"
              actions="view, View logs, $RUN_URL" ;;
          esac
          auth=()
          if [ -n "$NTFY_TOKEN" ]; then auth=(-H "Authorization: Bearer $NTFY_TOKEN"); fi
          curl -sS --fail-with-body --retry 3 \
            "${auth[@]}" \
            -H "Title: $title" \
            -H "Priority: $priority" \
            -H "Tags: $tags" \
            -H "Click: $click" \
            -H "Actions: $actions" \
            --data-raw "$message" \
            "$NTFY_URL" \
            || echo "::warning::ntfy notification failed"

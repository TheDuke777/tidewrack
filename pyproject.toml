[project]
name = "tidewrack"
# Last released version (bumped by tools/release.py; do not edit by hand).
version = "0.8.1"
description = "Text-based procgen roguelike"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jonathon Duke" }
]
dependencies = [
    "flet>=1.0.5",
    # Exact pin: the APK build installs binary wheels only, and pydantic pins one
    # pydantic-core version. Flet's Android index (pypi.flet.dev) has cp314 arm64
    # wheels for pydantic-core 2.46.4 (= pydantic 2.13.4), not for 2.14.x's 2.50.x.
    # Check https://pypi.flet.dev/pydantic-core/ before bumping.
    "pydantic==2.13.4",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.5",
    "flet-desktop>=1.0.5",
    "flet-web>=1.0.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.0.5",
]
# Lint + unit tests, used by CI and tools/release.py.
ci = [
    "pytest>=8",
    "ruff>=0.6",
]
# Pinned so CI-built APKs are reproducible (the bundled Python is chosen by flet-cli).
build = [
    "flet-cli==1.0.5",
]

[tool.ruff]
line-length = 100
src = ["src", "tools"]  # so imports of tidewrack/release sort as first-party

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools", "sim"]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
# Permanent identity (CLAUDE.md §10): never change bundle_id. Dev builds override
# it with `--bundle-id tech.dukedigital.tidewrack.dev`.
org = "tech.dukedigital"
product = "Tidewrack"
bundle_id = "tech.dukedigital.tidewrack"
company = "Duke Digital"
copyright = "Copyright (C) 2026 Duke Digital"
# Android versionCode. Strictly increases every release; never reused.
# Bumped by tools/release.py; do not edit by hand.
build_number = 38

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# Tidewrack's icon (transparent art in icon.png) sits on black, matching the
# original artwork; black also hides background-removal halos around the sword.
# Android uses icon_android.png instead: the same art padded to ~60% of the
# canvas so circular launcher masks don't clip it. Source art lives in art/.
icon_background = "#000000"

# The splash falls back to icon.png, so give it the same black backdrop in both themes.
[tool.flet.splash]
color = "#000000"
dark_color = "#000000"

[tool.flet.app]
path = "src"

[tool.flet.android]
# arm64-only, fixed from the first release so Komi Store's asset pinning stays valid.
target_arch = ["arm64-v8a"]
